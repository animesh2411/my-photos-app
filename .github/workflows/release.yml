# Build & Release PhotoBridge
#
# Release Strategy: BRANCH-BASED CD & COMMIT-BASED CI
# --------------------------------------------------
# - Every push to master: builds PhotoBridge.exe + PhotoBridgeSetup.exe and
#   uploads them as workflow artifacts for testing/verification (CI). No release is created.
# - Push to a release branch (release/v*): builds the installer, auto-tags the
#   commit with the version string from the branch name, pushes the tag to origin,
#   and publishes a public GitHub Release with PhotoBridgeSetup.exe attached (CD).
#
# To publish a release (e.g., v1.0.0):
#   git checkout -b release/v1.0.0
#   git push origin release/v1.0.0

name: Build & Release PhotoBridge

on:
  push:
    branches:
      - master
      - 'release/v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write  # Required for pushing tags and creating Releases

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required to push tags back to the repository

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build with PyInstaller
        run: pyinstaller PhotoBridge.spec

      - name: Verify build output
        run: |
          if (!(Test-Path "dist\PhotoBridge\PhotoBridge.exe")) {
            Write-Error "PyInstaller build failed — PhotoBridge.exe not found"
            exit 1
          }
          Write-Host "PhotoBridge.exe built successfully"
          $size = (Get-Item "dist\PhotoBridge\PhotoBridge.exe").Length / 1MB
          Write-Host "Size: $([math]::Round($size, 2)) MB"

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer with Inno Setup
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\iscc.exe" installer\PhotoBridge.iss

      - name: Verify installer output
        run: |
          if (!(Test-Path "dist\PhotoBridgeSetup.exe")) {
            Write-Error "Inno Setup build failed — PhotoBridgeSetup.exe not found"
            exit 1
          }
          Write-Host "PhotoBridgeSetup.exe built successfully"
          $size = (Get-Item "dist\PhotoBridgeSetup.exe").Length / 1MB
          Write-Host "Size: $([math]::Round($size, 2)) MB"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PhotoBridge-Windows
          path: |
            dist/PhotoBridgeSetup.exe
          retention-days: 30

      - name: Extract version from release branch name
        if: startsWith(github.ref, 'refs/heads/release/v')
        run: |
          $branch = "${{ github.ref_name }}"
          # Extract everything after 'release/' (e.g. v1.0.0)
          $version_tag = $branch.SubString($branch.IndexOf("release/") + 8)
          Write-Host "Extracted version tag: $version_tag"
          echo "RELEASE_TAG=$version_tag" >> $env:GITHUB_ENV

      - name: Tag commit
        if: startsWith(github.ref, 'refs/heads/release/v')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ env.RELEASE_TAG }}
          git push origin ${{ env.RELEASE_TAG }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/heads/release/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: dist/PhotoBridgeSetup.exe
          generate_release_notes: true
