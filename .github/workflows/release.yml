# Build & Release PhotoBridge
#
# Automated Release Strategy:
# ----------------------------
# - Every push to master triggers this workflow.
# - Automatically calculates the next patch version tag based on Git history.
# - Tags the commit and pushes the tag back to the repository.
# - Compiles the standalone executable and packages it into PhotoBridgeSetup.exe.
# - Automatically publishes a public GitHub Release for the new version, attaching the installer.

name: Build & Release PhotoBridge

on:
  push:
    branches: [master]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write  # Required for pushing tags and creating Releases

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required to fetch all tags and commit history for version calculation

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build with PyInstaller
        run: pyinstaller PhotoBridge.spec

      - name: Verify build output
        run: |
          if (!(Test-Path "dist\PhotoBridge\PhotoBridge.exe")) {
            Write-Error "PyInstaller build failed — PhotoBridge.exe not found"
            exit 1
          }
          Write-Host "PhotoBridge.exe built successfully"
          $size = (Get-Item "dist\PhotoBridge\PhotoBridge.exe").Length / 1MB
          Write-Host "Size: $([math]::Round($size, 2)) MB"

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer with Inno Setup
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\iscc.exe" installer\PhotoBridge.iss

      - name: Verify installer output
        run: |
          if (!(Test-Path "dist\PhotoBridgeSetup.exe")) {
            Write-Error "Inno Setup build failed — PhotoBridgeSetup.exe not found"
            exit 1
          }
          Write-Host "PhotoBridgeSetup.exe built successfully"
          $size = (Get-Item "dist\PhotoBridgeSetup.exe").Length / 1MB
          Write-Host "Size: $([math]::Round($size, 2)) MB"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PhotoBridge-Windows
          path: |
            dist/PhotoBridgeSetup.exe
          retention-days: 30

      - name: Auto-generate version tag
        run: |
          # Fetch all remote tags
          git fetch --tags
          
          # Find the latest tag
          $latest_tag = git describe --tags --abbrev=0 2>$null
          if (-not $latest_tag) {
            $latest_tag = "v0.1.0"
          }
          Write-Host "Latest tag: $latest_tag"
          
          # Increment the patch version
          if ($latest_tag -match '^v(\d+)\.(\d+)\.(\d+)') {
            $major = [int]$Matches[1]
            $minor = [int]$Matches[2]
            $patch = [int]$Matches[3] + 1
            $new_tag = "v$major.$minor.$patch"
          } else {
            $new_tag = "v0.1.1"
          }
          Write-Host "New tag: $new_tag"
          
          # Configure Git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Create and push the tag
          git tag $new_tag
          git push origin $new_tag
          
          # Expose environment variable
          echo "NEW_TAG=$new_tag" >> $env:GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.NEW_TAG }}
          files: dist/PhotoBridgeSetup.exe
          generate_release_notes: true
